name: Build Armbian Image (Trunk Compatible)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 清理 Armbian 可能误判的旧缓存
      - name: Clean Armbian temp files
        run: |
          sudo rm -rf cache
          sudo rm -rf .tmp
          sudo rm -rf output
          sudo rm -rf .config

      # 缓存加速
      - name: Cache Armbian build cache
        uses: actions/cache@v4
        with:
          path: |
            cache
            output/debs
            ~/.ccache
          key: armbian-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            armbian-cache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git build-essential gcc g++ bc \
            libncurses-dev libssl-dev bison flex \
            libelf-dev qemu-user-static debootstrap \
            liblz4-tool python3 python3-distutils ccache

      # 关键：忽略旧参数检测（解决 KERNEL_ONLY 报错）
      - name: Build Armbian image
        run: |
          export ARMBIAN_IGNORE_DEPRECATED=yes
          sudo ./compile.sh build \
            BOARD=onethingcloud-oes \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no

      - name: Prepare release files
        run: |
          mkdir release
          cp output/images/*.img* release/ || true
          cp output/debs/*.deb release/ || true

      # 自动生成 changelog
      - name: Generate changelog
        id: changelog
        run: |
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          git log -10 --pretty=format:"- %s" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 自动清理旧 Release（保留最近 5 个）
      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armbian-build-output
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: armbian-oes-${{ github.run_number }}
          name: Armbian OES Build ${{ github.run_number }}
          body: |
            ## 自动生成的更新日志
            ${{ steps.changelog.outputs.changelog }}

            ## 构建信息
            - BOARD: onethingcloud-oes
            - BRANCH: current
            - RELEASE: bookworm
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
