name: Build Armbian Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y \
            git build-essential gcc g++ bc \
            libncurses-dev libssl-dev bison flex \
            libelf-dev qemu-user-static debootstrap \
            liblz4-tool python3 python3-distutils

      - name: Build Armbian image
        run: |
          sudo ./compile.sh \
            BOARD=onethingcloud-oes \
            BRANCH=current \
            RELEASE=bookworm \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_ONLY=no \
            KERNEL_CONFIGURE=no

      - name: Prepare release files
        run: |
          mkdir release
          cp output/images/*.img* release/ || true
          cp output/debs/*.deb release/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: armbian-build-output
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: armbian-oes-${{ github.run_number }}
          name: Armbian OES Build ${{ github.run_number }}
          draft: false
          prerelease: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
