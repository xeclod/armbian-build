name: Build Armbian trunk (CI patched)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git build-essential gcc g++ bc \
            libncurses-dev libssl-dev bison flex \
            libelf-dev qemu-user-static debootstrap \
            liblz4-tool python3 python3-distutils ccache

      - name: Build Armbian image
        run: |
          ./compile.sh build \
            BOARD=onethingcloud-oes \
            BRANCH=edge \
            RELEASE=bookworm \
            KERNELBRANCH=tag:v6.18.12 \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no


      - name: Prepare release files
        run: |
          mkdir release
          cp output/images/*.img* release/ || true
          cp output/debs/*.deb release/ || true

      - name: Generate changelog
        id: changelog
        run: |
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          git log -10 --pretty=format:"- %s" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 5
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armbian-build-output
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: armbian-oes-${{ github.run_number }}
          name: Armbian OES Build ${{ github.run_number }}
          body: |
            ## 自动生成的更新日志
            ${{ steps.changelog.outputs.changelog }}

            ## 构建信息
            - BOARD: onethingcloud-oes
            - BRANCH: current
            - RELEASE: bookworm
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
